version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ["*"]
    ignore:
      # pyproject caps streamlit below 2; without this Dependabot widens the cap.
      - dependency-name: streamlit
        update-types: ["version-update:semver-major"]
