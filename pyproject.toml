[project]
name = "resumatch"
version = "0.1.0"
description = "Open-source resume scoring engine inspired by VMock patent US10346803B2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
    "keybert>=0.8.0",
    "language-tool-python>=2.8.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dashboard = [
    # 1.60 is the floor because the dashboard passes width="stretch", the
    # replacement for use_container_width, which older releases do not accept.
    # Capped below 2.0 so a major release cannot silently change widget APIs.
    "streamlit>=1.60.0,<2.0.0",
    "plotly>=5.24.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "pyflakes>=3.2.0",
]

[tool.setuptools.packages.find]
include = ["resumatch*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --timeout=30"
timeout = 30
asyncio_mode = "auto"
markers = [
    "slow: loads sentence-transformers/KeyBERT models; excluded from the fast run",
]
